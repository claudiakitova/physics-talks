name: rebuild-search-index

# Whenever papers in data/ change on main: rebuilds the search index, uploads it to the
# "index" release (so it doesn't bloat the repo), and bumps index_version.txt so the app
# restarts and downloads the new index.
on:
  push:
    branches: [main]
    paths:
      - "data/**.pdf"
      - "build_index.py"
      - "local_embedding.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build the index
        run: python build_index.py

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(date -u +%Y-%m-%dT%H%MZ)"
          echo "$VERSION" > storage/VERSION
          (cd storage && zip -q -r ../storage.zip .)
          gh release view index >/dev/null 2>&1 || gh release create index --title "Search index" --notes "The app downloads storage.zip from here. Rebuilt automatically when papers change."
          gh release upload index storage.zip --clobber
          echo "$VERSION" > index_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add index_version.txt
          git commit -m "Search index updated"
          git push
