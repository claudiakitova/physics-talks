name: app-test

# Installs the app from scratch and runs its test on the oldest and newest Python it
# supports, whenever the app or its requirements change (including Dependabot pull requests).
on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "streamlit_app.py"
      - "local_embedding.py"
      - "tests/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install from scratch
        run: pip install --no-cache-dir -r requirements.txt

      - name: Test the app
        run: python tests/test_app.py
